[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Build and upload artifacts on every PR
pr-run-mode = "upload"
# Publish GitHub attestations for the release artifacts
github-attestations = true
# Embed the dependency list in the binary and ship a CycloneDX SBOM
cargo-auditable = true
cargo-cyclonedx = true

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
aarch64-unknown-linux-musl = "ubuntu-26.04-arm"
x86_64-unknown-linux-musl = "ubuntu-26.04"
x86_64-pc-windows-msvc = "windows-2025"
global = "ubuntu-26.04"
