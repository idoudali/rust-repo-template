[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "aarch64-unknown-linux-musl",
  "x86_64-unknown-linux-musl",
  "x86_64-pc-windows-msvc",
]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Whether to install an updater program
install-updater = false
# Build and upload artifacts on every PR
pr-run-mode = "upload"
# Publish GitHub attestations for the release artifacts
github-attestations = true
# Embed the dependency list in the binary and ship a CycloneDX SBOM
cargo-auditable = true
cargo-cyclonedx = true
# Run each built binary on its own platform before anything is published
global-artifacts-jobs = ["./dist-smoke"]
# Install Rust from mise.toml in every build job
github-build-setup = "../dist-build-setup.yml"

[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
x86_64-apple-darwin = "macos-15-intel"
aarch64-unknown-linux-musl = "ubuntu-26.04-arm"
x86_64-unknown-linux-musl = "ubuntu-26.04"
x86_64-pc-windows-msvc = "windows-2025"
global = "ubuntu-26.04"

# Pin the actions in the generated release.yml to exact version tags, like
# the other workflows. Dependabot does not edit this table: bump it with the
# other actions, then `dist generate`.
[dist.github-action-commits]
"actions/checkout" = "v6.1.0"
"actions/upload-artifact" = "v7.0.2"
"actions/download-artifact" = "v8.0.2"
"swatinem/rust-cache" = "v2.9.2"
"actions/attest" = "v4.2.2"
