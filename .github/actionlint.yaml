# actionlint 1.7.12 predates the ubuntu-26.04 runner images; drop these
# labels once actionlint knows them.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

paths:
  # Generated by `dist generate`. Its global-artifacts upload reads
  # `steps.cargo-cyclonedx.output.paths`, a typo in dist's template (the
  # context is `outputs`), so that entry is always empty.
  .github/workflows/release.yml:
    ignore:
      - 'property "output" is not defined'
