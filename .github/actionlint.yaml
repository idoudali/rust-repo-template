# actionlint 1.7.12 predates the ubuntu-26.04 runner images; drop these
# labels once actionlint knows them.
self-hosted-runner:
  labels:
    - ubuntu-26.04
    - ubuntu-26.04-arm

paths:
  # Generated by `dist generate`, so findings in dist's own template are
  # ignored by name rather than edited by hand.
  .github/workflows/release.yml:
    ignore:
      # The global-artifacts upload reads `steps.cargo-cyclonedx.output.paths`,
      # a typo in dist's template (the context is `outputs`), so that entry is
      # always empty.
      - 'property "output" is not defined'
      # Unquoted variables and repeated redirects in dist's run scripts.
      - 'shellcheck reported issue in this script: SC2086:'
      - 'shellcheck reported issue in this script: SC2129:'
