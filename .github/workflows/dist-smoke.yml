name: dist-smoke

# Called by release.yml (a dist custom job, see dist-workspace.toml) once the
# per-platform builds finish, on pull requests and on releases alike. The
# Linux x86 release archive is unpacked and its binary run, so a binary that
# cannot start blocks the release. Other targets are built but not run; add
# them to TARGETS (and a runner matrix) to test them.

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (dist-manifest JSON) from release.yml
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (x86_64-unknown-linux-musl)
    runs-on: ubuntu-26.04
    env:
      TARGETS: x86_64-unknown-linux-musl
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: dist
          merge-multiple: true
      - name: Run the release binary
        shell: bash
        run: |
          set -euo pipefail
          for target in ${TARGETS}; do
            # Exact extensions: a glob would also match the .sha256 files.
            archive=""
            for ext in tar.xz tar.gz zip; do
              if [ -f "dist/rust-repo-template-cli-${target}.${ext}" ]; then
                archive="dist/rust-repo-template-cli-${target}.${ext}"
                break
              fi
            done
            test -n "${archive}"
            echo "::group::${archive}"
            out="unpacked/${target}"
            mkdir -p "${out}"
            case "${archive}" in
              *.zip) unzip -q "${archive}" -d "${out}" ;;
              *) tar -xf "${archive}" -C "${out}" ;;
            esac
            bin=$(find "${out}" -type f \( -name rust-repo-template -o -name rust-repo-template.exe \) | head -n 1)
            "${bin}" --version
            "${bin}" --help
            echo "::endgroup::"
          done
