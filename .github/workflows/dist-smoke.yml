name: dist-smoke

# Called by release.yml (a dist custom job, see dist-workspace.toml) once the
# per-platform builds finish, on pull requests and on releases alike. Each
# release archive is unpacked and its binary run on a matching runner, so a
# binary that cannot start blocks the release.

on:
  workflow_call:
    inputs:
      plan:
        description: The dist plan (dist-manifest JSON) from release.yml
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (${{ join(matrix.targets, ', ') }})
    strategy:
      fail-fast: false
      # The same target-to-runner matrix the builds used.
      matrix:
        include: ${{ fromJson(inputs.plan).ci.github.artifacts_matrix.include }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: artifacts-build-local-*
          path: dist
          merge-multiple: true
      - name: Run the release binary
        shell: bash
        env:
          TARGETS: ${{ join(matrix.targets, ' ') }}
        run: |
          set -euo pipefail
          for target in ${TARGETS}; do
            archive=$(find dist -maxdepth 1 -name "rust-repo-template-cli-${target}.tar.*" -o -maxdepth 1 -name "rust-repo-template-cli-${target}.zip" | head -n 1)
            echo "::group::${archive}"
            out="unpacked/${target}"
            mkdir -p "${out}"
            case "${archive}" in
              *.zip) unzip -q "${archive}" -d "${out}" ;;
              *) tar -xf "${archive}" -C "${out}" ;;
            esac
            bin=$(find "${out}" -type f \( -name rust-repo-template -o -name rust-repo-template.exe \) | head -n 1)
            "${bin}" --version
            "${bin}" --help
            echo "::endgroup::"
          done
