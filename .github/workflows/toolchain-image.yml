name: toolchain-image

# Builds the toolchain image from docker/toolchain.Dockerfile and the mise
# manifests, tags it by a hash of those inputs, and pushes it to GHCR. An
# existing tag is reused, so most runs only resolve the image reference.
# ci.yml calls this workflow first (on PRs, pushes to main and, through
# release-checks.yml, release tags) and runs its Linux jobs inside the
# resulting image, referenced by digest; it can also be run by hand. The shell
# logic lives in tools/ci/ so it runs the same locally (`mise run
# toolchain-tag`, `toolchain-resolve`, `toolchain-smoke`).
#
# Pull requests from this repository push the hash tag, because CI on the PR
# runs inside it. Pull requests from forks cannot write packages: they build
# and smoke-test the image without pushing, so a fork PR that changes the
# image inputs needs a maintainer to push the branch here for CI to pass.

on:
  workflow_call:
    outputs:
      image:
        description: Image reference pinned by digest (name@sha256:...)
        value: ${{ jobs.publish.outputs.image || jobs.plan.outputs.image }}
      tag:
        description: Human-readable image tag (name:hash) for the logs
        value: ${{ jobs.plan.outputs.tag }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    name: resolve image tag
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: read
    outputs:
      tag: ${{ steps.ref.outputs.tag }}
      repo: ${{ steps.ref.outputs.repo }}
      image: ${{ steps.ref.outputs.image }}
      exists: ${{ steps.ref.outputs.exists }}
      # Fork PRs get a read-only token: build and test, never push.
      push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The tag is a hash of the image inputs (tools/ci/toolchain-tag.sh). If
      # it is already in GHCR, record its digest and skip the build.
      - name: Compute the image tag and check whether it exists
        id: ref
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rust-repo-template-toolchain
        run: tools/ci/toolchain-resolve.sh

  build:
    name: build (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.exists != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
          - arch: arm64
            runner: ubuntu-26.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build for smoke test
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/toolchain.Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: toolchain:smoke
          cache-from: type=gha,scope=toolchain-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=toolchain-${{ matrix.arch }}
      - name: Smoke test
        run: tools/ci/toolchain-smoke.sh toolchain:smoke
      # Rebuilt from the cache above; `load` and a registry push with
      # provenance and SBOM cannot share one build.
      - name: Push by digest
        id: push
        if: needs.plan.outputs.push == 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/toolchain.Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ needs.plan.outputs.repo }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=toolchain-${{ matrix.arch }}
          provenance: mode=max
          sbom: true
      # The publish job joins the per-arch digests; artifacts carry them there.
      - name: Save digest
        if: needs.plan.outputs.push == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: mkdir -p /tmp/digests && touch "/tmp/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v7.0.2
        if: needs.plan.outputs.push == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  # Runs after a fresh build to tag the multi-arch image, and on pushes to
  # main to point :main (the dev container's tag) at it, built or reused.
  publish:
    name: publish
    needs: [plan, build]
    if: >-
      !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.push == 'true'
      && (needs.build.result == 'success'
      || (needs.build.result == 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        if: needs.build.result == 'success'
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the manifest list and tags
        id: publish
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          EXTRA_TAGS: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main' || '' }}
        run: tools/ci/toolchain-publish.sh /tmp/digests "${EXTRA_TAGS}"
