name: mise-lock
on: push
permissions:
  contents: read
jobs:
  lock:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        variant: [pr2, pr6]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v3
        with:
          version: 2026.10.4
          install: false
      - env:
          GITHUB_TOKEN: ${{ github.token }}
          VARIANT: ${{ matrix.variant }}
        run: |
          mkdir work
          cp "lock/${VARIANT}.toml" work/mise.toml
          cd work
          mise trust
          mise lock
          echo "===BEGIN==="
          cat mise.lock
          echo "===END==="
