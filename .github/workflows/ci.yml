name: ci

# The checks for pull requests and pushes to main, all on Linux inside the
# toolchain image. macOS and Windows are only tested before a release:
# release-checks.yml calls this workflow and adds them. Draft pull requests
# are skipped; the checks start when the PR is marked ready for review.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  toolchain:
    name: toolchain image
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    uses: ./.github/workflows/toolchain-image.yml
    permissions:
      contents: read
      packages: write

  # One job, so the toolchain image is pulled once: pulling it takes far
  # longer than most of the checks. Every check runs even when an earlier one
  # fails, so a run reports all failures at once.
  checks:
    name: checks (linux)
    needs: toolchain
    runs-on: ubuntu-26.04
    container:
      # name@sha256:... from toolchain-image.yml. zizmor cannot see through
      # the expression, so it is told the reference is pinned.
      image: ${{ needs.toolchain.outputs.image }} # zizmor: ignore[unpinned-images]
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --user root
    steps:
      - name: Show toolchain image
        env:
          IMAGE: ${{ needs.toolchain.outputs.image }}
          TAG: ${{ needs.toolchain.outputs.tag }}
        run: echo "${TAG} = ${IMAGE}"
      - uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false
          # The conventional commits check walks the PR's history.
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2.9.2
      - run: mise ls --current && gcc --version | head -n 1
      # fmt, clippy, cargo deny, typos, rumdl, actionlint, shellcheck and
      # an offline zizmor; see .pre-commit-config.yaml.
      - name: Hooks (prek)
        if: ${{ !cancelled() }}
        run: mise run hooks
      # zizmor is a static security checker for GitHub Actions workflows. It
      # flags template injection from untrusted inputs (PR titles, branch
      # names) into `run:` scripts, credentials left in checkouts, overly
      # broad `permissions`, unpinned actions and images, and cache poisoning
      # in release jobs. The hook runs it offline; this adds the online
      # audits. Settings and accepted exceptions are in .github/zizmor.yml.
      - name: zizmor (online audits use the token read-only)
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor .github/workflows
      - name: Test
        if: ${{ !cancelled() }}
        run: mise run test
      - name: Coverage
        id: coverage
        if: ${{ !cancelled() }}
        run: mise run coverage
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.coverage.outcome == 'success' }}
        with:
          name: coverage
          path: |
            lcov.info
            target/llvm-cov/html
          retention-days: 14
      - name: Rustdoc
        if: ${{ !cancelled() }}
        run: mise run docs
      - name: Package and install
        if: ${{ !cancelled() }}
        run: mise run package
      - name: MSRV (Rust 1.85)
        if: ${{ !cancelled() }}
        env:
          MISE_ENV: msrv
        run: rustc --version && mise run check
      - name: Conventional commits
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # `cog check A..B` also checks A itself, so verify each PR commit.
        # Inside a repository cog reads the git identity and aborts when it is unset.
        run: |
          git config user.name ci && git config user.email ci@localhost
          for commit in $(git rev-list --no-merges "${BASE_SHA}..HEAD"); do
            git log -1 --format='%h %s' "$commit"
            cog verify "$(git log -1 --format=%B "$commit")" > /dev/null
          done
