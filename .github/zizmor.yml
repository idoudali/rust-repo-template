rules:
  # Actions are referenced by exact version tag (vX.Y.Z), not commit SHA, so
  # people can read them; Dependabot bumps them. See AGENTS.md.
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
  # `uses: ./...` for local reusable workflows is fine; the `$/` form is newer
  # than some tooling (actionlint) understands.
  self-repository:
    disable: true
  # release.yml is generated by `dist generate` (actions pinned through
  # github-action-commits in dist-workspace.toml). These findings come from
  # dist's template, which this repo does not edit; every other audit still
  # runs on it.
  excessive-permissions:
    ignore: [release.yml]
  template-injection:
    ignore: [release.yml]
  cache-poisoning:
    ignore: [release.yml]
  unpinned-images:
    ignore: [release.yml]
  secrets-inherit:
    ignore: [release.yml]
