version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]
    commit-message:
      prefix: build
  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    commit-message:
      prefix: build
  - package-ecosystem: github-actions
    directory: /
    # release.yml is generated by `dist generate`; Dependabot editing it would
    # fail the dist-check hook. Its pins live in [dist.github-action-commits]
    # in dist-workspace.toml: bump them by hand, then `mise run dist-generate`.
    exclude-paths: [".github/workflows/release.yml"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
