[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/idoudali/rust-repo-template"
authors = ["Ioannis Doudalis"]
publish = false
readme = "README.md"
keywords = ["template", "cli"]
categories = ["command-line-utilities"]

[workspace.dependencies]
rust-repo-template = { path = "crates/rust-repo-template", version = "0.1.0" }
clap = { version = "4.6", features = ["derive"] }
assert_cmd = "2.2"
predicates = "3.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"

[workspace.lints.clippy]
# Whole groups at warn; CI turns warnings into errors with -D warnings.
pedantic = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
