# cargo-deny: advisories, licenses, banned crates and allowed sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Any RustSec advisory (vulnerability, unmaintained, yanked) fails the check.
yanked = "deny"

[licenses]
unused-allowed-license = "allow"
# Licenses compatible with an Apache-2.0 project. Extend deliberately.
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
